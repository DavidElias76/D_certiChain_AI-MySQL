
services:
  blockchain:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: certichain-blockchain
    user: root

    entrypoint: ["anvil"]

    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --accounts
      - "20"
      - --mnemonic
      - "test test test test test test test test test test test junk"
      - --state
      - /data/blockchain-state.json
      - --state-interval
      - "30"

    ports:
      - "127.0.0.1:8545:8545"

    volumes:
      - blockchain_data:/data

    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  blockchain_data:
    name: certichain_blockchain_data
